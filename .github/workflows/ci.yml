name: LAND-JEPA Continuous Integration & System Health Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Health Probes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Core Pytest Suite
        run: |
          pytest tests/test_i18n_parity.py tests/test_functional_e2e_transactions.py tests/gis/test_real_insar_pipeline.py tests/gis/test_real_terrain_raster.py tests/test_system_health.py -v

      - name: Run Full System Health Check CLI
        run: |
          python scripts/run_full_system_health_check.py

  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/dashboard/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend/dashboard
          npm ci

      - name: Build Frontend Application
        run: |
          cd frontend/dashboard
          npm run build
